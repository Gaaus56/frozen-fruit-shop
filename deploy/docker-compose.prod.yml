# Chạy trên VPS:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Chỉ Caddy mở cổng ra ngoài (80/443). Postgres, API, web, admin chỉ nói chuyện trong mạng nội bộ.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 4000
      PUBLIC_URL: https://api.${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN},https://admin.${DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 12h
      OTP_ENCRYPTION_KEY: ${OTP_ENCRYPTION_KEY:-}
      UPLOAD_DIR: /data/uploads
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    volumes:
      # Ảnh admin tải lên — phải nằm trong volume để không mất khi build lại image.
      - uploads_data:/data/uploads

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Biến NEXT_PUBLIC_* được "đóng gói" vào mã trình duyệt lúc build.
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - admin
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
