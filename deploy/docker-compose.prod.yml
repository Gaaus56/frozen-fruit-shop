# Chạy trên VPS:  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Chỉ Caddy mở cổng ra ngoài (80/443). Postgres, API, admin chỉ nói chuyện trong mạng nội bộ.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      WEB_APP_URL: ${WEB_APP_URL}
      ADMIN_APP_URL: https://admin.${DOMAIN}

  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - admin
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
