services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Trùng tên DB trong DATABASE_URL của apps/api/.env.example (chỉ có tác dụng khi tạo volume lần đầu).
      POSTGRES_DB: traicay28
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
