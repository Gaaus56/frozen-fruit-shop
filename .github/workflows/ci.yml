name: CI

on:
  # demo là nhánh đang deploy (Render / Vercel) — PR vào demo phải qua CI như main.
  pull_request:
    branches: [main, demo]
  push:
    branches: [admin]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (also builds shared packages)
        run: npm ci

      # Chặn merge khi thư viện có lỗ hổng mức critical đã công bố. (Chưa dùng mức high: CLI Prisma 6 còn
      # deepmerge-ts < 8 — chỉ đọc file cấu hình của chính dự án; hết khi nâng Prisma 7, xem docs audit 2026-10-30.)
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint web
        run: npm run lint:web

      - name: Lint admin
        run: npm run lint:admin

      - name: Build web
        run: npm run build:web

      - name: Build admin
        run: npm run build:admin

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Type-check api
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/api

      - name: Build api
        run: npm run build:api
