name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Review PR diff with Gemini (free tier)
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Chưa có secret GEMINI_API_KEY, bỏ qua AI review."
            exit 0
          fi

          gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" | head -c 150000 > full.diff

          {
            echo "Bạn là reviewer code cho monorepo Next.js (apps/web, apps/admin) + NestJS + Prisma (apps/api)."
            echo "Hãy review diff của pull request dưới đây bằng tiếng Việt, ngắn gọn."
            echo "Chỉ nêu vấn đề thật sự: lỗi logic, bảo mật (auth, lộ bí mật, injection), import/route bị hỏng,"
            echo "lỗi giao diện/responsive/truy cập, thiếu xử lý lỗi ở ranh giới hệ thống."
            echo "Bỏ qua lỗi định dạng mà ESLint đã bắt. Nhóm kết quả theo mức độ (Nghiêm trọng / Nên sửa / Gợi ý)."
            echo "Nếu không có vấn đề gì, chỉ cần viết một câu xác nhận."
            echo
            echo "----- DIFF (có thể đã bị cắt nếu quá dài) -----"
            cat full.diff
          } > prompt.txt

          jq -n --rawfile text prompt.txt \
            '{contents:[{parts:[{text:$text}]}], generationConfig:{maxOutputTokens:2048}}' > request.json

          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d @request.json \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent")

          REVIEW=$(jq -r '.candidates[0].content.parts[0].text // empty' response.json)

          if [ "$HTTP_CODE" != "200" ] || [ -z "$REVIEW" ]; then
            echo "::warning::Gemini không trả kết quả (HTTP $HTTP_CODE), bỏ qua AI review lần này."
            cat response.json
            exit 0
          fi

          {
            echo "### 🤖 AI review (Gemini, miễn phí)"
            echo
            echo "$REVIEW"
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file comment.md
